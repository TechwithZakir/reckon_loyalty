[project]
name = "reckon_loyalty"
description = "Retail CRM, membership and loyalty on ERPNext and Frappe CRM, with a POS integration API"
authors = [{ name = "Reckon Technologies Ltd." }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
